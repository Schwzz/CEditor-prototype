[package]
name = "framecode"
version = "0.3.0"
description = "Framecode Windows desktop code-and-timeline editor prototype"
edition = "2021"

[lib]
name = "framecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
