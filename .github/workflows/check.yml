name: Windows desktop prototype
# CI runs automatically on pull requests and via explicit workflow_dispatch;
# the push trigger was removed to avoid duplicate runs on PR branches.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Desktop integration tests
        run: npm run test:desktop
      - name: Package portable executable and installer
        run: npm run dist:win
      - name: Launch packaged Windows application
        shell: pwsh
        run: ./scripts/check-package.ps1
      - name: Write SHA256 checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Framecode-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-QA
          path: build/qa/
          if-no-files-found: ignore
  tauri:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri Windows bundle
        run: npm run build:tauri
      - name: Install WebView2 Runtime
        shell: pwsh
        run: |
          # The Windows Server runner image ships Edge/Chrome but NOT the
          # Microsoft Edge WebView2 Runtime (desktop Windows has it in-box;
          # Server does not). Without it the Tauri app starts, fails to
          # create its webview, and silently hangs alive with no window and
          # no CDP endpoint - which is exactly how the smoke test used to
          # fail ("CDP endpoint never became reachable"). Install the
          # Evergreen runtime before launching the app.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?link=2099617" -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
          $proc = Start-Process -FilePath "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent","/install" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "WebView2 runtime installer failed with exit code $($proc.ExitCode)." }
          $runtime = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          "WebView2 Runtime installed: $($runtime.pv)"
      - name: Tauri smoke test (launch real app)
        run: npm run test:tauri
      - name: Upload Tauri Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Framecode-Tauri-Windows-x64
          path: src-tauri/target/release/framecode.exe
          if-no-files-found: error
          retention-days: 7
